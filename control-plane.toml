version = 1
product_name = "Canopus"

[session]
read_order = [
  "AGENTS.md",
  "README.md",
  "docs/ARCHITECTURE.md",
  "rules/security.md",
  "rules/workspace.md",
  "docs/specs/reference-foundation/spec.md",
  "docs/specs/reference-foundation/plan.md",
  "docs/specs/reference-foundation/tasks.md",
  "docs/specs/bounded-convergence/spec.md",
  "docs/VERIFICATION.md",
  "docs/STATUS.md",
]

[registration]
root_environment = "CANOPUS_ROOT"
root_git_config = "canopus.root"
workspace_manifest_environment = "CANOPUS_WORKSPACE_MANIFEST"
workspace_manifest_git_config = "canopus.workspaceManifest"

