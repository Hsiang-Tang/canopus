<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 330" width="1120" height="330" role="img" aria-label="Canopus bounded convergence states"><title>Canopus bounded convergence states</title><defs><marker id="head-3fb950" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker><marker id="head-6e7681" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e7681"/></marker></defs><rect width="1120" height="330" rx="14" fill="#0d1117" stroke="#30363d"/><text x="28" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#e6edf3" text-anchor="start">Bounded convergence</text><text x="28" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">Only accepted outcomes and resolved blockers are progress. Commits, tests, and reviews are activity.</text><rect x="28" y="150" width="248" height="66" rx="12" fill="#0c2d6b" stroke="#4493f8" stroke-width="1.5"/><text x="152" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#4493f8" text-anchor="middle">HEALTHY</text><text x="152" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">progress this cycle</text><rect x="300" y="150" width="248" height="66" rx="12" fill="#3d2e00" stroke="#d29922" stroke-width="1.5"/><text x="424" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#d29922" text-anchor="middle">WATCH</text><text x="424" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">a cycle ended with no outcome</text><rect x="572" y="150" width="248" height="66" rx="12" fill="#3d2e00" stroke="#d29922" stroke-width="1.5"/><text x="696" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#d29922" text-anchor="middle">REALIGN</text><text x="696" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">stall ≥ realign · scope change</text><rect x="844" y="150" width="248" height="66" rx="12" fill="#4a1113" stroke="#f85149" stroke-width="1.5"/><text x="968" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#f85149" text-anchor="middle">CIRCUIT_BREAK</text><text x="968" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">stall ≥ break · allowance spent</text><path d="M276,183 H296" fill="none" stroke="#6e7681" stroke-width="1.8" marker-end="url(#head-6e7681)"/><path d="M548,183 H568" fill="none" stroke="#6e7681" stroke-width="1.8" marker-end="url(#head-6e7681)"/><path d="M820,183 H840" fill="none" stroke="#6e7681" stroke-width="1.8" marker-end="url(#head-6e7681)"/><path d="M686,150 Q686,104 400,104 Q152,104 152,146" fill="none" stroke="#3fb950" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#head-3fb950)"/><text x="420" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">verified progress resets the stall counter</text><rect x="28" y="256" width="248" height="50" rx="25" fill="#0f3d1e" stroke="#3fb950" stroke-width="1.5"/><text x="152" y="278" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#3fb950" text-anchor="middle">COMPLETE</text><text x="152" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9198a1" text-anchor="middle">every frozen item accepted → stop</text><path d="M152,216 V250" fill="none" stroke="#3fb950" stroke-width="1.8" marker-end="url(#head-3fb950)"/><text x="300" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">•  Out-of-scope findings are deferred, never executed.</text><text x="300" y="282" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">•  Allowances only decrease; a repeated blocker family breaks early.</text><text x="300" y="302" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">•  Material work during REALIGN escalates to CIRCUIT_BREAK.</text></svg>
